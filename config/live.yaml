# openclaw-trader 实盘配置
# 使用多账户模式分别配置现货和期货测试网

accounts:
  # 现货测试网账户
  - id: binance-spot-testnet
    provider: binance
    credentials_path: .secrets/binance-testnet.json
    testnet: true
    scenarios:
      - conservative-spot
      - aggressive-spot
    risk:
      position_ratio: 0.4
      max_positions: 2
      stop_loss_percent: 5
      take_profit_percent: 10

  # 期货测试网账户 - ITS v4.0
  - id: binance-futures-testnet
    provider: binance
    credentials_path: .secrets/binance-futures-testnet.json
    testnet: true
    scenarios:
      - futures-long-short    # ITS v4.0 双向策略
    risk:
      position_ratio: 0.20
      max_positions: 3
      stop_loss_percent: 0.5
      take_profit_percent: 2
      trailing_stop:
        enabled: true
        activation_percent: 0.5
        callback_percent: 0.5
