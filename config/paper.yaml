report_interval_hours: 24
scenarios:
  - id: conservative-spot
    name: 保守 × 现货
    enabled: true
    strategy_id: conservative
    initial_usdt: 10000
    fee_rate: 0.001
    slippage_percent: 0.05
    exchange:
      market: spot
      leverage:
        enabled: false
        default: 1
        max: 1
  - id: conservative-futures-3x
    name: 保守 × 合约 3x
    enabled: false
    strategy_id: conservative
    initial_usdt: 10000
    fee_rate: 0.0004
    slippage_percent: 0.08
    exchange:
      market: futures
      futures:
        contract_type: perpetual
        margin_mode: isolated
      leverage:
        enabled: true
        default: 3
        max: 3
    risk:
      stop_loss_percent: 3
      take_profit_percent: 9
      trailing_stop:
        enabled: true
        activation_percent: 5
        callback_percent: 1.5
      position_ratio: 0.1
      max_positions: 3
      max_position_per_symbol: 0.2
      max_total_loss_percent: 12
      daily_loss_limit_percent: 4
  - id: aggressive-spot
    name: 激进 × 现货
    enabled: false
    strategy_id: aggressive
    initial_usdt: 10000
    fee_rate: 0.001
    slippage_percent: 0.05
    exchange:
      market: spot
      leverage:
        enabled: false
        default: 1
        max: 1
  - id: aggressive-futures-3x
    name: 激进 × 合约 3x
    enabled: false
    strategy_id: aggressive
    initial_usdt: 10000
    fee_rate: 0.0004
    slippage_percent: 0.1
    exchange:
      market: futures
      futures:
        contract_type: perpetual
        margin_mode: isolated
      leverage:
        enabled: true
        default: 3
        max: 3
    risk:
      stop_loss_percent: 4
      take_profit_percent: 12
      trailing_stop:
        enabled: true
        activation_percent: 3
        callback_percent: 1
      position_ratio: 0.15
      max_positions: 4
      max_position_per_symbol: 0.3
      max_total_loss_percent: 20
      daily_loss_limit_percent: 8
  - id: trend-spot
    name: 趋势 × 现货
    enabled: false
    strategy_id: trend
    initial_usdt: 10000
    fee_rate: 0.001
    slippage_percent: 0.05
    exchange:
      market: spot
      leverage:
        enabled: false
        default: 1
        max: 1
  - id: trend-futures-5x
    name: 趋势 × 合约 5x
    enabled: true
    strategy_id: trend
    initial_usdt: 10000
    fee_rate: 0.0004
    slippage_percent: 0.12
    exchange:
      market: futures
      futures:
        contract_type: perpetual
        margin_mode: isolated
      leverage:
        enabled: true
        default: 5
        max: 5
    risk:
      stop_loss_percent: 2
      take_profit_percent: 10
      trailing_stop:
        enabled: true
        activation_percent: 3
        callback_percent: 1
      position_ratio: 0.06
      max_positions: 2
      max_position_per_symbol: 0.15
      max_total_loss_percent: 8
      daily_loss_limit_percent: 3
  - id: rsi-spot
    name: RSI均值回归 × 现货
    enabled: true
    strategy_id: rsi-pure
    initial_usdt: 10000
    fee_rate: 0.001
    slippage_percent: 0.05
    exchange:
      market: spot
      leverage:
        enabled: false
        default: 1
        max: 1
  - id: rsi-margin-2x
    name: RSI均值回归 × 杠杆2x
    enabled: true
    strategy_id: rsi-pure
    initial_usdt: 10000
    fee_rate: 0.001
    slippage_percent: 0.06
    exchange:
      market: margin
      leverage:
        enabled: true
        default: 2
        max: 2
    risk:
      stop_loss_percent: 4
      take_profit_percent: 8
      trailing_stop:
        enabled: false
        activation_percent: 5
        callback_percent: 2
      position_ratio: 0.12
      max_positions: 4
      max_position_per_symbol: 0.25
      max_total_loss_percent: 18
      daily_loss_limit_percent: 6
  - id: testnet-default
    name: Testnet × 阶段一数据积累
    enabled: true
    strategy_id: data-accumulation
    initial_usdt: 8202
    fee_rate: 0.001
    slippage_percent: 0.05
    exchange:
      market: spot
      testnet: true
      credentials_path: .secrets/binance-testnet.json
      leverage:
        enabled: false
        default: 1
        max: 1
    risk:
      stop_loss_percent: 3
      take_profit_percent: 9
      trailing_stop:
        enabled: true
        activation_percent: 5
        callback_percent: 1.5
      position_ratio: 0.1
      max_positions: 0
      max_position_per_symbol: 0.15
      max_total_loss_percent: 80
      daily_loss_limit_percent: 20
      atr_position:
        enabled: true
        risk_per_trade_percent: 1.5
        atr_multiplier: 1.5
        max_position_ratio: 0.15
      time_stop_hours: 48
  - id: futures-short-test
    name: Futures Testnet 空头测试
    enabled: false
    strategy_id: short-trend
    initial_usdt: 5000
    fee_rate: 0.0004
    slippage_percent: 0.03
    exchange:
      market: futures
      testnet: true
      credentials_path: .secrets/binance-futures-testnet.json
    symbols:
      - BTCUSDT
      - ETHUSDT
      - SOLUSDT
      - BNBUSDT
    risk:
      stop_loss_percent: 4
      take_profit_percent: 12
      trailing_stop:
        enabled: true
        activation_percent: 6
        callback_percent: 2.5
      position_ratio: 0.2
      max_positions: 3
      max_position_per_symbol: 0.3
  - id: futures-long-short
    name: Futures Testnet ITS v4.0
    enabled: true
    strategy_id: long-short
    initial_usdt: 5000
    fee_rate: 0.0004
    slippage_percent: 0.03
    exchange:
      market: futures
      testnet: true
      credentials_path: .secrets/binance-futures-testnet.json
    risk:
      stop_loss_percent: 0.5
      take_profit_percent: 2
      take_profit_1: 1.5
      take_profit_2: 2.5
      min_rr: 1.5
      minimal_roi:
        '0': 0.03
        '30': 0.02
        '60': 0.015
        '120': 0.005
      trailing_stop:
        enabled: true
        activation_percent: 0.5
        callback_percent: 0.5
      trailing_stop_positive: 0.01
      trailing_stop_positive_offset: 0.02
      trailing_only_offset_is_reached: true
      position_ratio: 0.25
      max_positions: 5
      min_positions: 2
      max_position_per_symbol: 0.3
      max_total_loss_percent: 20
      daily_loss_limit_percent: 8
      correlation_filter:
        enabled: true
        threshold: 0.7
        lookback: 60
      btc_hedge:
        enabled: true
        btc_strong_up_trigger: true
    symbols:
      - BTCUSDT
      - ETHUSDT
      - BNBUSDT
      - SOLUSDT
      - ADAUSDT
      - AVAXUSDT
      - MATICUSDT
      - DOGEUSDT
      - DOTUSDT
      - XRPUSDT
  - id: dca-spot
    name: DCA 分批建仓 × 现货
    enabled: true
    strategy_id: conservative
    initial_usdt: 10000
    fee_rate: 0.001
    slippage_percent: 0.05
    exchange:
      market: spot
      leverage:
        enabled: false
        default: 1
        max: 1
    risk:
      stop_loss_percent: 8
      take_profit_percent: 20
      trailing_stop:
        enabled: true
        activation_percent: 8
        callback_percent: 3
      position_ratio: 0.08
      max_positions: 3
      max_position_per_symbol: 0.3
      max_total_loss_percent: 15
      daily_loss_limit_percent: 5
      dca:
        enabled: true
        tranches: 3
        drop_pct: 3
        max_hours: 48
