# 双向策略 ITS v4.5 高频交易模式
# 市场类型：futures / margin（spot 只有多头生效）
# 目标：快速获取信号 + 多次交易 + 单笔少量获利
# 更新：2026-03-29 调整为高频交易模式
name: "ITS v4.5 高频策略"
description: "MA+RSI 双条件确认 + 快进快出 + ROI时间衰减止盈"

timeframe: "1h"
trend_timeframe: "4h"

strategy:
  ma:
    short: 20
    long: 60
  rsi:
    period: 14
    oversold: 30          # 超卖区域（做多信号用）
    overbought: 70        # 超买区域（做空信号用）
    overbought_exit: 75   # RSI超过此值考虑止盈（zeneo-ai标准）
  macd:
    enabled: true         # 保留计算（用于日志/指标），但不做入场条件
    fast: 12
    slow: 26
    signal: 9
  volume:
    surge_ratio: 1.5     # 成交量放大1.5倍确认趋势
    low_ratio: 0.5         # 成交量萎缩50%以下不做空

  # ── 资金费率过滤（V4.5新增）────────────────────
  # 极端资金费率作为反向信号
  funding_rate:
    long_threshold: 0.30    # 做多费率上限（超过此值不做多）
    short_threshold: 0.15   # 做空费率下限（低于此值不做空）

  # ── 多空比过滤（V4.5新增）────────────────────
  long_short_ratio:
    extreme_long_threshold: 3.0    # 做多极度拥挤（>3.0反向做空）
    extreme_short_threshold: 0.5   # 做空极度拥挤（<0.5反向做多）
    long_biased_threshold: 1.8     # 做多偏重
    short_biased_threshold: 0.8    # 做空偏重

# ─────────────────────────────────────────────────
# 入场信号（ITS V4.5 高频交易模式）
# 目标：快速获取信号 + 多次交易 + 单笔少量获利
# ─────────────────────────────────────────────────
signals:
  buy:
    - ma_bullish             # EMA20 > EMA60（趋势确认）
    - rsi_not_overbought     # RSI < 70（未超买）
  sell:
    - ma_bearish             # 趋势反转，平多
    - rsi_overbought         # RSI > 70 超买，平多
  short:
    - ma_bearish             # EMA20 < EMA60（趋势向下）
    - rsi_not_oversold       # RSI > 30（未超卖）
  cover:
    - ma_bullish             # 趋势反转，平空
    - rsi_oversold           # RSI < 30 超卖，平空

risk:
  # ── 止盈止损（高频交易模式）─────────────────────
  stop_loss_percent: 0.3    # 止损0.3%（更紧截断亏损）
  take_profit_percent: 0.8  # 总止盈目标0.8%（快速获利）
  take_profit_1: 0.5       # 第一批止盈0.5%（50%仓位）
  take_profit_2: 0.8       # 第二批止盈0.8%（50%仓位）

  # ── 最小盈亏比过滤─────────────────────────────
  min_rr: 0.2              # 降低要求增加交易机会

  # ── ROI 时间衰减止盈（快速模式）─────────────────
  minimal_roi:
    "0":    0.005        # 开仓等0.5%就走
    "5":    0.003        # 5分钟：等0.3%就走
    "15":   0.002        # 15分钟：等0.2%就走
    "30":   0.001        # 30分钟：等0.1%就走（保本）

  # ── 移动止损 ──────────────────────────────────
  trailing_stop:
    enabled: true
    activation_percent: 0.2    # 盈利0.2%即激活
    callback_percent: 0.2      # 回调0.2%止损

  # ── 仓位管理（高频交易）─────────────────────────
  position_ratio: 0.20       # 单笔仓位20%（4x杠杆=80%仓位）
  max_positions: 5           # 最多同时持有5个仓位
  min_positions: 2           # 最少保持2个仓位
  max_position_per_symbol: 0.25  # 单币种不超过25%仓位

  # ── 风控熔断 ──────────────────────────────────
  max_total_loss_percent: 20   # 全账户回撤20%停止交易
  daily_loss_limit_percent: 8  # 单日亏损8%停止交易

  # ── 相关性过滤（新增）──────────────────────────
  # 避免在高相关性币种上同时持仓
  correlation_filter:
    enabled: true
    threshold: 0.70         # 相关性阈值70%
    lookback: 60            # 回看60根K线

  # ── BTC对冲保护 ────────────────────────────────
  # BTC强势上涨时，减少其他币种的空单
  btc_hedge:
    enabled: true
    btc_strong_up_trigger: true  # BTC强势时减少其他空单

# ─────────────────────────────────────────────────
# 市场自适应参数 regime_overrides（高频交易模式）
# ─────────────────────────────────────────────────
regime_overrides:
  reduced_size:              # 震荡高波动市：快进快出
    take_profit_percent: 0.8
    stop_loss_percent: 0.3
    position_ratio: 0.15
    minimal_roi:
      "0":   0.005       # 开仓等0.5%
      "5":   0.003       # 5min等0.3%
      "15":  0.002       # 15min等0.2%
  breakout_watch:           # 低波动震荡市：继续交易
    take_profit_percent: 0.5
    stop_loss_percent: 0.2
    position_ratio: 0.15
    minimal_roi:
      "0":   0.003       # 开仓等0.3%
      "5":   0.002       # 5min等0.2%
      "10":  0.001       # 10min等0.1%

# ─────────────────────────────────────────────────
# 保护机制 protections（新增）
# 止损后自动进入冷却期，防止连续亏损
# ─────────────────────────────────────────────────
protections:
  cooldown:                 # 止损后冷却
    enabled: true
    stop_duration_candles: 5        # 冷却5根K线

  stoploss_guard:           # 止损次数保护
    enabled: true
    lookback_period_candles: 48     # 回看48根K线
    trade_limit: 3                  # 窗口内止损次数上限
    stop_duration_candles: 12      # 暂停12根K线
    only_per_pair: false            # false=全局止损计数

  max_drawdown:            # 最大回撤保护
    enabled: true
    lookback_period_candles: 48
    trade_limit: 3
    max_allowed_drawdown: 0.15     # 总亏损超过15%时暂停
    stop_duration_candles: 12

  low_profit_pairs:        # 低利润币种过滤
    enabled: true
    lookback_period_candles: 48
    trade_limit: 3
    required_profit: 0.0           # 平均不亏损才允许
    stop_duration_candles: 12
